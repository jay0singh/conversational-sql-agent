name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  # Deterministic backend tests — no secrets, no DB, no LLM. The reliable gate.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r agent/requirements.txt -r requirements-dev.txt
      - run: pytest -m "not db and not llm" -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  # Live tests (safety + NL->SQL eval) need a DB + Groq key. Runs on direct
  # pushes/dispatch (not fork PRs, which have no secrets). If the secrets
  # aren't configured, the tests skip and the job still passes.
  live:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      AGENT_DB_URL: ${{ secrets.AGENT_DB_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r agent/requirements.txt -r requirements-dev.txt
      - run: pytest -m "db or llm" -v
